<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเช็คอิน พขร.</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 15px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    .form-group { text-align: left; margin-bottom: 12px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
    input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; background: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-1 { background-color: #28a745; }
    .btn-2 { background-color: #17a2b8; }
    .btn-3 { background-color: #007bff; }
    .btn-4 { background-color: #6c757d; }
    
    #status-loading {
      display: none;
      background-color: #fff3cd;
      color: #856404;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>บันทึกสถานะการเดินทาง</h2>
    
    <div class="form-group">
      <label for="driver-name">👤 ชื่อ / รหัส พขร.:</label>
      <input type="text" id="driver-name" placeholder="พิมพ์ชื่อ หรือ รหัส พขร.">
    </div>

    <div class="form-group">
      <label for="head-plate">🚛 ทะเบียนหัว:</label>
      <input type="text" id="head-plate" placeholder="พิมพ์ทะเบียนหัว เช่น 71-1077">
    </div>

    <div class="form-group">
      <label for="tail-plate">🚚 ทะเบียนหาง:</label>
      <input type="text" id="tail-plate" placeholder="พิมพ์ทะเบียนหาง เช่น 71-3941">
    </div>

    <div class="form-group">
      <label for="cargo-type">📦 ประเภทสินค้า:</label>
      <input type="text" id="cargo-type" placeholder="พิมพ์ประเภทสินค้า เช่น สินค้าทั่วไป, เหล็ก">
    </div>

    <label style="text-align: left; margin-top: 15px;">📍 เลือกสถานะที่ต้องการเช็คอิน:</label>
    <button class="btn-1 action-btn" onclick="sendCheckin('ออกเดินทาง')">🚚 ออกเดินทาง</button>
    <button class="btn-2 action-btn" onclick="sendCheckin('ถึงคลังรับสินค้า')">🏭 ถึงคลังรับสินค้า</button>
    <button class="btn-3 action-btn" onclick="sendCheckin('ถึงสถานที่ปลายทาง')">🏢 ถึงสถานที่ปลายทาง</button>
    <button class="btn-4 action-btn" onclick="sendCheckin('ถึงลานจอด')">🅿️ ถึงลานจอด</button>

    <div id="status-loading">⏳ กำลังจับพิกัด GPS และส่งข้อมูล...</div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwSoKKGTiKVzVvlgWb5YvVWVh_w33MEocoKP_yrpsfhj3ghSK10VvqJcUDbuPV9oPt4/exec";
    const MY_LIFF_ID = "วาง_LIFF_ID_จาก_STEP_3_ตรงนี้";

    async function main() {
      await liff.init({ liffId: MY_LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    }
    main();

    function toggleButtons(disable) {
      const buttons = document.querySelectorAll('.action-btn');
      buttons.forEach(btn => btn.disabled = disable);
      document.getElementById('status-loading').style.display = disable ? 'block' : 'none';
    }

    function sendCheckin(status) {
      const driverName = document.getElementById('driver-name').value.trim();
      const selectedHead = document.getElementById('head-plate').value.trim();
      const selectedTail = document.getElementById('tail-plate').value.trim();
      const cargoType = document.getElementById('cargo-type').value.trim();
      
      if (!driverName) {
        alert("กรุณากรอกชื่อ/รหัส พขร. ก่อนกดเช็คอินครับ!");
        return;
      }
      if (!selectedHead) {
        alert("กรุณากรอกทะเบียนหัวก่อนกดเช็คอินครับ!");
        return;
      }
      if (!selectedTail) {
        alert("กรุณากรอกทะเบียนหางก่อนกดเช็คอินครับ!");
        return;
      }

      if (!navigator.geolocation) {
        alert("เบราว์เซอร์ไม่รองรับการดึงพิกัด GPS");
        return;
      }

      toggleButtons(true);

      const options = {
        enableHighAccuracy: false,
        timeout: 8000,
        maximumAge: 30000
      };

      navigator.geolocation.getCurrentPosition(async (position) => {
        const payload = {
          driverName: driverName,
          headPlate: selectedHead,
          tailPlate: selectedTail,
          cargoType: cargoType,
          status: status,
          latitude: position.coords.latitude,
          longitude: position.coords.longitude
        };

        try {
          fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          alert("บันทึกสถานะ [" + status + "]\nพขร.: " + driverName + "\nเรียบร้อยแล้ว!");
          liff.closeWindow();
        } catch (err) {
          alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
          toggleButtons(false);
        }
      }, (error) => {
        alert("ไม่สามารถดึงตำแหน่ง GPS ได้ กรุณาเปิด GPS และลองใหม่อีกครั้ง");
        toggleButtons(false);
      }, options);
    }
  </script>
</body>
</html>
