    <label style="text-align: left; margin-top: 15px;">📍 เลือกสถานะที่ต้องการเช็คอิน:</label>
    <button class="btn-1" onclick="sendCheckin('ออกเดินทาง')">🚚 ออกเดินทาง</button>
    <button class="btn-2" onclick="sendCheckin('ถึงคลังรับสินค้า')">🏭 ถึงคลังรับสินค้า</button>
    <button class="btn-3" onclick="sendCheckin('ถึงสถานที่รับสินค้า')">🏢 ถึงสถานที่รับสินค้า</button>
    <button class="btn-4" onclick="sendCheckin('ถึงลานจอด')">🅿️ ถึงลานจอด</button>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz_1JVb0PbUQxu8jtKcXNSBuhrQkUjdh7OODC103CxF8RPNKzg3VOdqSG2D4C-sUcdY/exec";
    const MY_LIFF_ID = "2011023562-ouJgJlYP";
    let currentUserName = "";

    async function main() {
      await liff.init({ liffId: MY_LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        currentUserName = profile.displayName;
        document.getElementById('user-name').innerText = "ผู้ใช้งาน: " + currentUserName;
      } else {
        liff.login();
      }
    }
    main();

    function sendCheckin(status) {
      const selectedHead = document.getElementById('head-plate').value;
      const selectedTail = document.getElementById('tail-plate').value;
      
      if (!selectedHead) {
        alert("กรุณาเลือกทะเบียนหัวก่อนกดเช็คอินครับ!");
        return;
      }
      if (!selectedTail) {
        alert("กรุณาเลือกทะเบียนหางก่อนกดเช็คอินครับ!");
        return;
      }

      if (!navigator.geolocation) {
        alert("เบราว์เซอร์ไม่รองรับการดึงพิกัด GPS");
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        const payload = {
          driverName: currentUserName,
          headPlate: selectedHead,
          tailPlate: selectedTail,
          status: status,
          latitude: position.coords.latitude,
          longitude: position.coords.longitude
        };

        try {
          await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          alert("บันทึกสถานะ [" + status + "]\nหัว: " + selectedHead + " | หาง: " + selectedTail + "\nเรียบร้อยแล้ว!");
          liff.closeWindow();
        } catch (err) {
          alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
        }
      }, (error) => {
        alert("กรุณาเปิด GPS และอนุญาตให้เข้าถึงตำแหน่ง");
      });
    }
  </script>
